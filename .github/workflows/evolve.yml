name: Evolve (bucle autónomo)

on:
  schedule:
    # Cada 5 minutos = 288 corridas/día. Con ITERATIONS_PER_RUN=1 eso da
    # ~288 peticiones/día, repartidas parejo en las 24hs (una cada 5 min),
    # bien por debajo del objetivo de 300 y con margen amplio respecto
    # al límite real de la cuota gratuita (500/día).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # también se puede disparar a mano desde GitHub

permissions:
  contents: write

concurrency:
  group: evolve-loop
  cancel-in-progress: false  # nunca cortar una corrida a mitad de camino

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests pytest

      - name: Correr el bucle de mejoras
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ITERATIONS_PER_RUN: "1"
        run: python evolve/evolve.py

      - name: Commitear cambios aceptados
        run: |
          git config user.name "limpieza-total-omega-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/ evolve/budget_state.json evolve/cycle_state.json evolve/metrics.jsonl evolve_log.md PROGRESS.md
          if git diff --cached --quiet; then
            echo "No hay cambios para commitear."
            exit 0
          fi
          git commit -m "Auto-mejora aceptada por el bucle evolve"
          # Reintentar con rebase: si empujaste algo a mano mientras el bot
          # trabajaba, sin esto el push falla y la mejora se pierde.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "Push exitoso en el intento $attempt."
              exit 0
            fi
            echo "Push falló en el intento $attempt, reintentando..."
            sleep 5
          done
          echo "No se pudo empujar después de 3 intentos."
          exit 1
