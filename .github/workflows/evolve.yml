name: Evolve (bucle autónomo)

on:
  schedule:
    # Cada 30 minutos = 48 corridas/día. Con ITERATIONS_PER_RUN=20
    # eso da hasta ~960/día, bajo el objetivo de 1000 y con margen
    # respecto al tope duro de 1500 definido en evolve/budget.py.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # también se puede disparar a mano desde GitHub

permissions:
  contents: write

concurrency:
  group: evolve-loop
  cancel-in-progress: false  # nunca cortar una corrida a mitad de camino

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests pytest

      - name: Correr el bucle de mejoras
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ITERATIONS_PER_RUN: "20"
        run: python evolve/evolve.py

      - name: Commitear cambios aceptados
        run: |
          git config user.name "limpieza-total-omega-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/ evolve/budget_state.json evolve_log.md
          git diff --cached --quiet || git commit -m "Auto-mejora aceptada por el bucle evolve"
          git push
